<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Memora — AI Cognitive &amp; Memory Companion for elderly dementia patients. Providing cognitive activities, memory assistance, and caregiver support." />
    <title>Memora — AI Cognitive &amp; Memory Companion</title>
    <!--
      Fonts: Inter (body) + Noto Serif (brand) + Noto script fonts for
      Bengali (as, bn), Devanagari (hi, ne, brx), Meetei Mayek (mni), Telugu (te).
      Mizo, Khasi, Garo use Latin — covered by Inter / Noto Sans.
      System fonts are defined as fallbacks so the app works offline.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=Noto+Sans:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Meetei+Mayek:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
